spring:
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 201MB
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  threads:
    virtual:
      enabled: true

audio:
  flac-command: ${AUDIO_FLAC_COMMAND:flac}
  fdkaac-command: ${AUDIO_FDKAAC_COMMAND:fdkaac}
  command-timeout-seconds: ${AUDIO_COMMAND_TIMEOUT_SECONDS:180}
