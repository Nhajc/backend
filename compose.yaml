services:
  postgres:
    image: postgres:17.12-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      PGPORT: ${PGPORT}
    ports:
      - "127.0.0.1:${PGPORT}:${PGPORT}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: pg_isready -h 127.0.0.1 -U ${POSTGRES_USER}
      interval: 5s
      retries: 10

  server:
    build: .
    env_file: .env
    environment:
      PGHOST: postgres
      S3_ENDPOINT: http://minio:9000
    ports:
      - "${SERVER_PORT}:${SERVER_PORT}"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  minio:
    build:
      context: ./docker/minio
    image: nhajc-minio:local
    command: [ "server", "/data", "--console-address", ":9001" ]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test:
        [ "CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9000/minio/health/live" ]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres-data:
  minio-data:
