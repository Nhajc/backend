services:
  postgres:
    image: postgres:17.12-alpine
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      PGPORT: ${DB_PORT}
    ports:
      - "127.0.0.1:${DB_PORT}:${DB_PORT}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: pg_isready -h 127.0.0.1 -U ${DB_USER}
      interval: 5s
      retries: 10

  server:
    build: .
    env_file: .env
    environment:
      DB_HOST: postgres
    volumes:
      - media:/app/media
    ports:
      - "${SERVER_PORT}:${SERVER_PORT}"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
  media:
